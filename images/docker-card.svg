<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dockerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0DB7ED"/>
      <stop offset="100%" stop-color="#0B5FBD"/>
    </linearGradient>
    <linearGradient id="containerFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E6F3FA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="180" fill="url(#dockerBg)"/>

  <!-- subtle wave -->
  <path d="M0,140 Q150,110 300,140 T600,140 L600,180 L0,180 Z"
        fill="#ffffff" fill-opacity="0.08"/>
  <path d="M0,155 Q150,130 300,155 T600,155 L600,180 L0,180 Z"
        fill="#ffffff" fill-opacity="0.06"/>

  <!-- whale silhouette (abstract, simplified) -->
  <g opacity="0.85" transform="translate(340,70)">
    <!-- body -->
    <path d="M0,40 Q0,0 45,0 L145,0 Q180,0 180,40 L180,55 Q180,70 160,70 L20,70 Q0,70 0,55 Z"
          fill="url(#whale)"/>
    <!-- tail -->
    <path d="M175,25 L200,10 L200,55 L175,45 Z" fill="url(#whale)"/>
    <!-- eye dot -->
    <circle cx="150" cy="30" r="4" fill="#0B5FBD" fill-opacity="0.6"/>
    <!-- spout -->
    <path d="M135,-5 Q140,-20 150,-10" stroke="#ffffff" stroke-width="2" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- stacked containers on the whale -->
  <g transform="translate(60,40)">
    <!-- row 1 (back) -->
    <rect x="20"  y="0"  width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="75"  y="0"  width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="130" y="0"  width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>

    <!-- row 2 (middle) -->
    <rect x="0"   y="30" width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="55"  y="30" width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="110" y="30" width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="165" y="30" width="50" height="24" rx="3" fill="url(#containerFace)" stroke="#ffffff" stroke-opacity="0.4"/>

    <!-- row 3 (front, highlighted) -->
    <rect x="30"  y="60" width="50" height="24" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="85"  y="60" width="50" height="24" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="140" y="60" width="50" height="24" rx="3" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- terminal cursor blip (bottom left) -->
  <g transform="translate(40,145)">
    <text x="0" y="0" fill="#ffffff" font-family="'Fira Code', 'Courier New', monospace" font-size="13" opacity="0.85">
      $ docker run -it
    </text>
    <rect x="110" y="-10" width="7" height="12" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
