<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="agentBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="600" height="180" fill="url(#agentBg)"/>

  <!-- decorative sparks -->
  <g opacity="0.25" fill="#ffffff">
    <circle cx="50"  cy="30"  r="1.8"/>
    <circle cx="120" cy="155" r="1.2"/>
    <circle cx="540" cy="40"  r="1.5"/>
    <circle cx="560" cy="120" r="1"/>
    <circle cx="20"  cy="140" r="1"/>
    <circle cx="480" cy="165" r="1.8"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(50,28)">
    <!-- window frame -->
    <rect x="0" y="0" width="300" height="124" rx="10" fill="url(#termBg)" stroke="#ffffff" stroke-opacity="0.25"/>
    <!-- traffic lights -->
    <circle cx="14" cy="14" r="4" fill="#FC8181"/>
    <circle cx="28" cy="14" r="4" fill="#F6E05E"/>
    <circle cx="42" cy="14" r="4" fill="#68D391"/>
    <text x="150" y="18" fill="#718096" font-family="'Fira Code', 'Courier New', monospace" font-size="9" text-anchor="middle">claude</text>
    <!-- divider -->
    <line x1="0" y1="28" x2="300" y2="28" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- content lines -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="10.5">
      <text x="14" y="48" fill="#ED8936">▸</text>
      <text x="28" y="48" fill="#E2E8F0">/plan</text>

      <text x="14" y="64" fill="#ED8936">▸</text>
      <text x="28" y="64" fill="#E2E8F0">Reorganise into a replication</text>
      <text x="28" y="78" fill="#E2E8F0">package per CLAUDE.md.</text>

      <text x="14" y="98" fill="#9F7AEA">Planning…</text>
      <text x="14" y="112" fill="#48BB78">✓</text>
      <text x="28" y="112" fill="#E2E8F0">plan ready</text>

      <!-- blinking cursor -->
      <rect x="14" y="115" width="6" height="2" fill="#ED8936">
        <animate attributeName="opacity" values="1;0.1;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- arrow / flow indicator -->
  <g transform="translate(370,90)" opacity="0.85">
    <path d="M0,0 L50,0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42,-6 L52,0 L42,6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- package / folder output -->
  <g transform="translate(430,32)">
    <!-- folder body -->
    <path d="M8,10 L45,10 L52,18 L105,18 Q113,18 113,26 L113,100 Q113,108 105,108 L8,108 Q0,108 0,100 L0,18 Q0,10 8,10 Z"
          fill="#ffffff" fill-opacity="0.96"/>
    <!-- tab -->
    <rect x="5" y="5" width="45" height="10" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <!-- file lines -->
    <g fill="#4A5568" font-family="'Fira Code', 'Courier New', monospace" font-size="8">
      <text x="10" y="34">README.md</text>
      <text x="10" y="46">master.R</text>
      <text x="10" y="58">Makefile</text>
      <text x="10" y="70">code/</text>
      <text x="10" y="82">data/raw/</text>
      <text x="10" y="94">output/</text>
    </g>
    <!-- check badge -->
    <circle cx="96" cy="98" r="11" fill="#48BB78"/>
    <path d="M91,98 L95,102 L102,93" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
